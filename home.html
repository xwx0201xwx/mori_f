<!DOCTYPE html>
<html lang="ja">

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

<script>
    function scroll_fadein(){
        jQuery('.scroll_up,.scroll_up-sp,.scroll_up-pc').each(function(){
            var elemPos = jQuery(this).offset().top;
            var scroll = jQuery(window).scrollTop();
            var windowHeight = jQuery(window).height();
            if (scroll > elemPos - windowHeight + 100){
                jQuery(this).addClass('on');
            }
        });
    }
    jQuery(function(){
        jQuery(window).scroll(function (){
            scroll_fadein();
        });
        scroll_fadein();
    });
</script>  

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドローンショップ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 背景動画を設定 */
        body, html {
            height: 100%; /* 高さを100%に設定 */
            margin: 0; /* マージンをなくす */
        }

        /* 動画のスタイル */
        .background-video {
            position: relative;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: calc(var(--vh, 1vh)* 100);
            /* background: url(../images/mv_bg.jpg) no-repeat; */
            background-size: cover;
            background-position: center;
            overflow: hidden;
            z-index: -1;
            /* 他の要素よりも後ろに配置 */
        }

        /* その他のコンテンツ */
        .content {
            position: relative;
            z-index: 1;
            /* コンテンツを動画の上に表示 */
            text-align: center;
            color: white;
            /* 文字色を白に設定 */
            padding-top: 20%;
        }

        /* 文字ふわぁ部分のCSS */
        .bg_lgray {
            background: #e9ebeb;
        }

        .pdBox_1 {
            padding: 7em 0 5em;
        }

        .container650 {
            width: 70%;
            max-width: 850px;
            margin: 0 auto;
            text-align: center;
        }

        /* 文字の向き(縦文字) */
        .vertical {
            writing-mode: vertical-rl;
        }

        .flex,
        .flex_pc,
        .flex_all,
        .flex_pcpro {
            display: flex;
            justify-content: space-between;
        }

        .fd-column {
            flex-direction: column;
        }

        /* 文字を上にスクロール */
        .scroll_up {
            transition: 1.5s ease-in-out;
            transition-behavior: normal;
            transition-duration: 1.5s;
            transition-timing-function: ease-in-out;
            transition-delay: 0s;
            transition-property: all;
            transform: translateY(30px);
            opacity: 0;
        }

        /* 文字サイズ1 */
        .fz40 {
            font-size: 40px;
        }

        /* nikiから持ってきたやつ */
        .ls025 {
            letter-spacing: 0.25em;
        }

        .pd0 {
            padding: 0;
        }

        .sp-mg {
            padding: 5vw 0;
        }

        .fz17 {
            font-size: 30px;
        }

        .ls015 {
            letter-spacing: 0.15em;
        }

        /*----------------------------
        scroll_up ｜下から上へ出現
        ----------------------------*/
        .scroll_up {
            transition: 1.5s ease-in-out;
            transform: translateY(30px);
            opacity: 0;
        }
        .scroll_up.on {
            transform: translateY(0);
            opacity: 1.0;
        }
    </style>
</head>

<body>

                <h2><span class="fz40 ls025">
                    360°広がる感動。<br>

            </div>

<style type="text/css">
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
    }

    /* 製品紹介セクション */
    /* styles.css */
    .animated-text {
        position: absolute;
        bottom: 20px;
        /* 動画の下から20pxの位置に文字を配置 */
        left: 50%;
        /* 水平方向に中央揃え */
        transform: translateX(-50%);
        /* 文字を中央に調整 */
        font-size: 24px;
        color: white;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        /* 文字の周りに影をつけて見やすくする */
        background-color: rgba(0, 0, 0, 0.5);
        /* 背景に半透明の黒を追加 */
        padding: 10px;
        animation: slideIn 2s ease-out;
    }

    @keyframes slideIn {
        0% {
            transform: translateX(-100%);
            opacity: 0;
        }

        100% {
            transform: translateX(0);
            opacity: 1;
        }
    }

    /* フッター */
    footer {
        text-align: center;
        background-color: #333;
        color: white;
        padding: 20px 0;
    }
</style>
